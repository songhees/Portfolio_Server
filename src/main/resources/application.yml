spring:
  profiles:
    active: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080

logging:
  level:
    com.chiup.portfolio: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

# ────────────────────────────────────────────────
# Swagger UI → 테스트로 생성된 openapi3.yaml 로드
# 먼저 ./gradlew openapi3 실행 필요
# ────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi3.yaml        # 생성된 스펙 파일 경로 (dev: file:build/api-spec/, prod: classpath:static/)
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /api-docs

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/portfolio_dev
    username: ${DB_USERNAME:portfolio}
    password: ${DB_PASSWORD:portfolio}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: create-drop

  # dev 환경: build/api-spec/ 폴더를 정적 리소스로 제공
  # (bootJar 없이 bootRun에서도 Swagger UI가 spec 파일을 읽을 수 있게)
  web:
    resources:
      static-locations:
        - classpath:/static/
        - file:build/api-spec/

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20

  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.chiup.portfolio: INFO
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.chiup.portfolio: DEBUG
    org.hibernate.SQL: DEBUG
