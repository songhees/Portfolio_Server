buildscript {
   ext {
      restdocsVersion = '0.17.1'
   }
}

plugins {
	id 'java'
    id 'war'
    id 'com.diffplug.spotless' version '8.2.1'
    id 'com.epages.restdocs-api-spec' version "${restdocsVersion}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

spotless {
    java {
        target("src/**/*.java")

        googleJavaFormat()

        removeUnusedImports()
        importOrder()             // import 정렬
        trimTrailingWhitespace()  // 줄 끝 공백 제거
        endWithNewline()          // 파일 끝 개행 보장
    }

    format("misc") {
        target("**/*.gradle", "**/*.md", "**/.gitignore")
        trimTrailingWhitespace()
        endWithNewline()
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform("org.springframework:spring-framework-bom:6.2.15")
    implementation "org.springframework:spring-webmvc"
    implementation "org.springframework:spring-context"
    implementation "org.springframework:spring-jdbc"
    testImplementation 'org.springframework:spring-test'

    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'

    // logging dependencies
    implementation platform('org.apache.logging.log4j:log4j-bom:2.24.1')
    implementation 'org.apache.logging.log4j:log4j-api'
    implementation 'org.apache.logging.log4j:log4j-core'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl'

    // database dependencies
    implementation "com.zaxxer:HikariCP:7.0.2"
    runtimeOnly "org.postgresql:postgresql:42.7.4"

    // mybatis dependencies
    implementation "org.mybatis:mybatis:3.5.19"
    implementation "org.mybatis:mybatis-spring:3.0.5"

    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    implementation platform("com.fasterxml.jackson:jackson-bom:2.21.0")
    implementation "com.fasterxml.jackson.core:jackson-databind"

    compileOnly "jakarta.servlet:jakarta.servlet-api:6.0.0"

    // interface documentation dependencies
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc:3.0.3'
    testImplementation 'com.epages:restdocs-api-spec-mockmvc:' + restdocsVersion
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310"

    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

openapi3 {
    servers = [ { url = "http://localhost:8080" } ]
    title = 'song-post API'
    version = '0.0.1'
    description = 'API for managing song posts'
    format = 'yaml'
    outputDirectory = 'src/main/resources/static/docs'
}

tasks.named('test') {
    useJUnitPlatform()
}

// WAR 파일을 압축하지 않고, exploded 형태로 생성하는 작업
task explodedWar(type: Copy) {
    into "$buildDir/ROOT"
    with war
}

configurations.all {
    exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'

    // 추가로 안전을 위해 이것도 배제 (Spring Boot 환경이 아닐 때 가끔 충돌함)
    exclude group: 'org.slf4j', module: 'jul-to-slf4j'
}
