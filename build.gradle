buildscript {
   ext {
      restdocsVersion = '0.17.1'
   }
}

plugins {
	id 'java'
    id 'war'
    id 'checkstyle'
    id("com.diffplug.spotless") version "8.2.1"
    id 'com.epages.restdocs-api-spec' version "${restdocsVersion}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

spotless {
    java {
        target("src/**/*.java")

        googleJavaFormat().aosp()

        removeUnusedImports()
        importOrder()             // import 정렬
        trimTrailingWhitespace()  // 줄 끝 공백 제거
        endWithNewline()          // 파일 끝 개행 보장
    }

    format("misc") {
        target("**/*.gradle", "**/*.md", "**/.gitignore")
        trimTrailingWhitespace()
        endWithNewline()
    }
}

checkstyle {
    toolVersion = '13.1.0'
    ignoreFailures = false
    configFile = rootProject.file('checkstyle.xml')
}

configurations {
	asciidoctorExt 
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform("org.springframework:spring-framework-bom:6.2.15")
    implementation "org.springframework:spring-webmvc"
    implementation "org.springframework:spring-context"

    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'

    // logging dependencies
    implementation 'org.apache.logging.log4j:log4j-core:2.24.1'
    implementation 'org.apache.logging.log4j:log4j-api:2.24.1'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.24.1'

    // database dependencies
    implementation "org.springframework:spring-jdbc"
    implementation "com.zaxxer:HikariCP:7.0.2"
    runtimeOnly "org.postgresql:postgresql:42.7.4"

    // mybatis dependencies
    implementation "org.mybatis:mybatis:3.5.19"
    implementation "org.mybatis:mybatis-spring:3.0.5"

    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'

    implementation platform("com.fasterxml.jackson:jackson-bom:2.21.0")
    implementation "com.fasterxml.jackson.core:jackson-databind"

    compileOnly "jakarta.servlet:jakarta.servlet-api:6.0.0"

    // interface documentation dependencies
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc:4.0.0'
    testImplementation 'com.epages:restdocs-api-spec-mockmvc:' + restdocsVersion

    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

openapi3 {
    servers = [ { url = "http://localhost:8080" } ]
    title = 'song-post API'
    version = '0.0.1'
    description = 'API for managing song posts'
    format = 'yaml'
    outputDirectory = 'src/main/webapp/static'
}

